{% extends "base.html" %}
{% block title %}Вход · F2C{% endblock %}
{% block content %}
<div class="panel" style="max-width: 460px; margin: 60px auto;">
  <h1>Вход в кабинет</h1>
  <p class="sub">Рабочая почта и пароль от inventory.f2c.ru</p>
  {% if error %}<div class="error-box" style="margin-bottom: 14px;">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label>Рабочая почта</label>
    <input type="email" name="email" required placeholder="user@f2c.ru">
    <label>Пароль</label>
    <input type="password" name="password" required placeholder="••••••••">
    <div style="margin-top: 18px;">
      <button type="submit" style="width: 100%;">Войти в личный кабинет</button>
    </div>
  </form>
  {% if demo %}
  <p class="hint" style="margin-top: 14px;">Демо-режим: подойдёт любой email, пароль — <code>secret</code>.</p>
  {% endif %}
</div>
{% endblock %}
